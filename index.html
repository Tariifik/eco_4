<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}

.blocks{display:flex;flex-direction:column;gap:10px}

.src{font-size:.8rem;color:var(--muted);font-style:italic}
.pt{margin:0;font-size:1.02rem;line-height:1.6;padding-left:14px;position:relative;overflow-wrap:anywhere}
.pt::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.55}
.pt.new{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pt.ph{color:var(--muted);font-size:.88rem;border-bottom:2px dashed var(--line);padding-bottom:2px;width:fit-content}

.pt b,.row b{background:var(--accent-soft);color:var(--ink);font-weight:600;padding:0 3px;border-radius:4px}
.mn{background:var(--hint-soft);color:var(--hint);border-radius:10px;padding:10px 12px;font-size:.92rem}
.mn strong,.wr strong{font-weight:700}
details.mn summary{cursor:pointer}

.wr{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}

.fig .c2{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;opacity:.75}
.fig .hi{stroke:var(--warn);stroke-width:3}
.fig .dot{fill:var(--accent)}
.fig .lb{font-size:12px;font-weight:700;fill:currentColor}
.fig .sm{font-size:10px;fill:var(--muted)}
.figcap{font-size:.8rem;color:var(--muted);text-align:center;margin:4px 0 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;font-size:1rem;padding:13px 10px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.sm{font-size:.88rem;padding:8px 12px;font-weight:500}
.btn.again{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.know{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
:root[data-theme="dark"] .btn.primary{color:#0d1220}

.btn.ghost{background:transparent}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px dashed var(--accent);color:transparent;cursor:pointer;border-radius:4px;padding:0 3px;user-select:none;background:var(--accent-soft)}
.blank.open{color:var(--ink);border-bottom-style:solid;background:var(--ok-soft);user-select:auto}
.blank.open b{background:none;padding:0}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.done .q{font-size:1.3rem}

.list{display:flex;flex-direction:column;gap:10px}

.item .pt{font-size:.97rem}

.item .mn,.item .wr{font-size:.85rem;padding:7px 10px}

.empty{color:var(--muted);text-align:center;padding:20px}
.tips{font-size:.88rem;color:var(--muted);margin:0}
.jump{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:.98rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--block);color:var(--ink);cursor:pointer;line-height:1.45}

.opt.bad{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

.verdict{font-weight:700}

.row{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}

.row .nm{font-weight:650}

.row .tx:not(.open) b{background:none;color:transparent}
.refs{font-size:.8rem;color:var(--muted)}
@media (max-width:480px){.q{font-size:1.22rem}.seg button{padding:6px 8px;font-size:.84rem}.card{padding:18px 14px}.row{grid-template-columns:1fr;gap:4px}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}.pt.new{animation:none}}
</style>
</head>

  "возникает путём [объединения имущественных, денежных взносов (паёв)] или распределения собственности на доли (паи); предполагает [непосредственное участие собственников] в делах предприятия",
  "[акционерная собственность] — групповая частная собственность, создаваемая путём [выпуска и реализации ценных бумаг] (акций и облигаций); наличие ценных бумаг — её отличительная особенность",
  "это [объединение индивидуальных капиталов]; рассчитана на [крупное предпринимательство] и обычно не используется мелкими компаниями"]],
 m:"Индивидуальная — малый бизнес, их больше всего. Групповая — кооперативная (паи, личное участие) и акционерная (акции, крупный бизнес)."},
{n:10,t:"Формы собственности в Российской Федерации",u:"Форма",d:[
 ["5 форм","Гражданский кодекс РФ, ст. 212",
  "[частная] собственность, в том числе собственность юридических лиц",
  "[государственная] собственность",
  "[муниципальная] собственность",
  "собственность [общественных объединений (организаций)]",
  "[смешанные] формы собственности в любом их сочетании"]],
 m:"«ЧГМОС»: Частная, Государственная, Муниципальная, Общественных объединений, Смешанные."},
{n:11,t:"Государственная собственность",u:"Блок",d:[
 ["Возникает в результате","",
  "[национализации] — перехода имущества из частной собственности в государственную, как правило [методом выкупа]",
  "[строительства новых объектов] за счёт средств государственного бюджета",
  "[покупки контрольного пакета акций] частных компаний"],
 ["Преобладает преимущественно","",
  "в отраслях [производственной и социальной инфраструктуры]",
  "в современных [наукоёмких] отраслях",
  "в [малорентабельных и капиталоёмких] отраслях, не выгодных частному бизнесу, но необходимых обществу"],
 ["Отличие от частных предприятий","",
  "как правило, [не ставят первоочерёдной задачей максимизацию прибыли]",
  "подчиняют финансовые интересы [политическим, общенародным, социальным целям]"],
 ["Где необходима общественная собственность","",
  "[наука, образование, здравоохранение, социальное обеспечение]",
  "[национальные парки, заповедники, памятники культуры]; [космический, военно-промышленный] комплексы и т.д."]],
 m:"Откуда: национализация, стройка за счёт бюджета, контрольный пакет. Где: инфраструктура, наукоёмкие, невыгодные бизнесу отрасли."},
{n:12,t:"Собственность общественных объединений (организаций)",u:"Определение",d:[
 ["","ФЗ «Об общественных объединениях» от 19.05.1995 № 82-ФЗ, ст. 30","общественное объединение, являющееся [юридическим лицом], может иметь в собственности","[земельные участки, здания, строения, сооружения, жилищный фонд, транспорт, оборудование, инвентарь], имущество культурно-просветительного и оздоровительного назначения, [денежные средства, акции, другие ценные бумаги] и иное имущество,","необходимое для [материального обеспечения деятельности], указанной в его [уставе]"]],
 m:"Может владеть почти всем — но для целей из устава. ФЗ № 82-ФЗ, ст. 30."},

{n:13,t:"Приватизация",u:"Определение",d:[
 ["","","передача имущества, объектов собственности, находящихся в [государственной или муниципальной собственности],","[в собственность граждан и юридических лиц],","предусмотренная [законами о приватизации]"]],
 m:"Из государственной/муниципальной — в частную. Обратный процесс — национализация (п. 11)."},
{n:14,t:"Основные цели приватизации в России",u:"Цель",d:[
 ["7 целей","",
  "формирование слоя [частных собственников-предпринимателей]",
  "создание [конкурентной среды]",
  "содействие [демонополизации] экономики",
  "[финансовая стабилизация] экономики (снижение бюджетного дефицита, темпов инфляции, сокращение государственной задолженности)",
  "[повышение эффективности] деятельности предприятий",
  "привлечение [иностранных инвестиций]",
  "[социальная защита населения] и развитие объектов социальной инфраструктуры за счёт средств от приватизации"]],
 m:"Собственники, Конкуренция, Демонополизация, Финансы, Эффективность, Иностранные инвестиции, Соцзащита."},
{n:15,t:"Методы приватизации в России",u:"Группа",d:[
 ["Бесплатная приватизация","",
  "наделение всех граждан [приватизационными чеками (ваучерами)] для приобретения объектов приватизации",
  "передача имущества государственных предприятий [их трудовым коллективам]: имущество в денежной форме, преобразованное в доли, паи, акции, делилось между работниками",
  "бесплатная [приватизация государственного жилья]"],
 ["Денежная приватизация","",
  "[конкурс (коммерческий)] — продажа предприятия покупателю, предложившему [наибольшую цену и согласившемуся выполнить условия] (сохранить профиль, численность занятых, условия труда и т.п.)",
  "[аукцион] — продажа предприятий и активов на открытых торгах [без дополнительных условий]; собственником становится предложивший [максимальную цену]",
  "продажа [акций государственного акционерного предприятия внешним инвесторам]",
  "[выкуп ранее арендованного] государственного имущества"]],
 m:"Бесплатно: ваучеры, трудовым коллективам, жильё. За деньги: конкурс (с условиями), аукцион (без условий), акции инвесторам, выкуп аренды."},
{n:16,t:"Основные итоги приватизации в России",u:"Итог",d:[
 ["5 итогов","Михайлов А.Ю. Приватизация в России: мифы и реальность // ЭКО. 2011. № 6. С. 5–25",
  "образование [крупного частного и полугосударственного сектора]",
  "формирование [принципиально новой структуры отношений собственности], не имеющей ничего общего с плановым хозяйством и благоприятствующей рыночной трансформации",
  "во многом [бесплатный характер] приватизации [не способствовал формированию реального капитала] и его накоплению",
  "почти [полный провал чековой приватизации]: доля акций для неё оказалась на порядок ниже, чем для иных способов",
  "подавляющая доля акций попала [в руки трудовых коллективов] — [неэффективных собственников]: заинтересованы в потреблении, а не в инвестировании, и не способны контролировать менеджмент"]],
 m:"2 плюса (новый сектор, новая структура) и 3 минуса (нет капитала, провал ваучеров, акции у трудовых коллективов)."},

{n:17,t:"Предпринимательство (3 определения)",u:"Определение",d:[
 ["Определение 1","Гражданский кодекс РФ, ст. 2","[самостоятельная], осуществляемая [на свой риск] деятельность,","направленная на [систематическое получение прибыли] от использования имущества, продажи товаров, выполнения работ или оказания услуг,","лицами, [зарегистрированными в этом качестве] в установленном законом порядке"],
 ["Определение 2","","[организация полезной производственной деятельности], направленной на производство товаров или оказание услуг,","[неотъемлемая часть хозяйственной деятельности] руководителей и специалистов предприятий, коммерческих и финансовых организаций"],
 ["Определение 3","","[процесс непрерывного поиска изменений] в потребностях, спросе конечного потребителя,","[удовлетворения этой потребности] путём организации производства, сбыта, маркетинга, логистики, менеджмента,","ориентированных на [самые лучшие новации], приносящие максимум производительности на каждой стадии воспроизводства"]],
 m:"ГК: самостоятельно + риск + систематическая прибыль + регистрация («СРСР»)."},
{n:18,t:"Предприниматель (3 определения)",u:"Определение",d:[
 ["Определение 1","А. Смит","[собственник, рискующий своим капиталом]","ради [реализации коммерческой идеи] и [получения прибыли]"],
 ["Определение 2","Ж.-Б. Сэй","лицо, которое берётся [за свой счёт и риск] и [в свою пользу]","произвести какой-нибудь продукт"],
 ["Определение 3","И.А. Шумпетер","хозяйственный субъект, функция которого — [осуществление новых комбинаций факторов производства]","не только самостоятельный субъект, но и [тот, кто реально выполняет эту функцию], даже если он [служащий акционерного общества] или другой частной фирмы"]],
 m:"Смит — риск капиталом; Сэй — за свой счёт и в свою пользу; Шумпетер — новые комбинации (новатор), может быть и наёмным."},
{n:19,t:"Роль предпринимательства в экономическом развитии",u:"Роль",d:[
 ["12 ролей","",
  "нахождение [наиболее эффективных вариантов соединения факторов производства], позволяющих максимизировать прибыль",
  "увеличение [душевого продукта и дохода]",
  "[пусковой механизм и проводник структурных изменений] в экономике и обществе",
  "[катализатор экономического роста]",
  "[стимулирование инвестиций]",
  "[инновации] в экономическом росте",
  "создание [новых товаров и услуг]",
  "придаёт [гибкость] рыночной экономике",
  "создание [новых рабочих мест]",
  "формирует [конкурентную среду]",
  "осуществляет [прорыв по ряду важнейших направлений НТП]",
  "влияет на [местную экономическую ситуацию], укрепляет экономическую базу"]],
 m:"Группы: эффективность и доход → рост и структура → инвестиции и инновации → товары, гибкость, рабочие места, конкуренция → НТП и местная экономика."},
{n:20,t:"Факторы, обусловливающие готовность стать предпринимателем",u:"Фактор",d:[
 ["11 факторов","",
  "1. [Готовность отказаться от сложившегося образа жизни], желание человека",
  "2. [Сфера деятельности], опыт прежней работы, опыт в сфере маркетинга",
  "3. [Профессиональная подготовка]. Образование",
  "4. [Стечение обстоятельств]. Жизненные обстоятельства",
  "5. [Национальная культура]. Местные традиции",
  "6. [Государственная поддержка]",
  "7. [Начальный капитал]",
  "8. [Семья], семейные традиции. Детские годы",
  "9. [Школа, вуз]",
  "10. [Возраст, пол]",
  "11. [Живой пример окружающих]"]],
 m:"Сначала про самого человека (желание, опыт, образование), потом про среду (обстоятельства, культура, государство, капитал, семья, школа, возраст, пример)."},
{n:21,t:"Некоторые знания и умения, которыми должны обладать предприниматели",u:"Умение",d:[
 ["Умения 1–8","",
  "1. [Ясное понимание предпринимательства]. Отделение фактов от мифов",
  "2. Умение давать [взвешенные оценки]",
  "3. Умение находить [нестандартные решения]",
  "4. Умение вести себя и принимать решения [в условиях неопределённости]",
  "5. Умение [вырабатывать новые коммерческие идеи]",
  "6. Умение [оценивать перспективность новых идей]",
  "7. Знание и навыки, необходимые [для создания нового дела]",
  "8. [Управление малыми предприятиями]"],
 ["Умения 9–15","",
  "9. Способность дать [профессиональную оценку результатам своей деятельности]",
  "10. Умение [оценить внешнюю ситуацию]",
  "11. Умение оценивать любое действие [с точки зрения этики и морали]",
  "12. Умение [заключать сделки]",
  "13. Знание [психологических особенностей человека] — свои и тех, с кем он работает",
  "14. Умение [устанавливать контакты, вести переговоры]",
  "15. Умение [получать причитающееся]"]],
 m:"15 умений: 1–8 — про идеи и создание дела; 9–15 — про оценку, этику, людей и сделки.",
 x:"⚠ В файле опечатка: «отделение факторов от мифов» — по смыслу фактов."},
{n:22,t:"Восемь психологических типажей предпринимателей",u:"Типаж",d:[
 ["","","[Флюгер]","верно определяет [перспективные направления], но [редко доводит дело] до создания нового предприятия"],
 ["","","[Простак]","склонен [всё упрощать], считает, что любое предприятие можно создать в два счёта","часто становятся [прекрасными продавцами]: могут заставить поверить даже в самый невероятный прожект"],
 ["","","[Недотрога]","настолько [влюблён в свою идею], что каждого подозревает в намерении её украсть","эта [мания преследования] мешает отношениям взаимопомощи и доверия"],
 ["","","[Знайка]","прекрасные [познания в теории], которые [не подкреплены практическими навыками]"],
 ["","","[Аккуратист]","настолько [привык к порядку], что в критическую минуту теряется","не может управлять ситуацией [в обстановке неопределённости и хаоса]"],
 ["","","[Философ]","[не слишком стремится воплотить идею] в реальное дело; любит семинары и дискуссии","не рвётся к свершениям, поэтому ему необходима [хорошая команда управляющих]"],
 ["","","[Инопланетянин]","[не имеет адекватной мотивации и целей] для создания и развития собственного дела"],
 ["","","[Изобретатель]","больше беспокоится [о своём изобретении], чем о создании и развитии собственного дела"]],
 m:"«Флюгер, Простак, Недотрога, Знайка, Аккуратист, Философ, Инопланетянин, Изобретатель» — «Ф-П-Н-З-А-Ф-И-И»."},
{n:23,t:"Качества, характеризующие преуспевающих предпринимателей",u:"Группа",d:[
 ["Качества 1–9","",
  "у них есть [мечта], которую они ежедневно преследуют",
  "[безграничная вера] в их продукты или виды услуг",
  "постоянно [стремятся что-то сделать]",
  "это [изобретатели]",
  "[нетерпеливы и раздражительны]",
  "у них [всегда не хватает времени]",
  "[упорны и настойчивы]",
  "[нацелены на прибыль, на успех]",
  "[планируют на несколько лет вперёд]"],
 ["Качества 10–18","",
  "лучше, чем кто-либо, [понимают свою силу и слабость]",
  "[не боятся начать всё снова]",
  "[деньги не являются главным] или единственным мотивом",
  "всё, что касается их бизнеса, [умеют делать сами]",
  "понимают значение [тонких изменений] и их влияние на успех",
  "[хотят расти]",
  "понимают [главенствующую роль потребителя]",
  "[не думают, что идут на большой риск]",
  "знают, что такое [потратить последнюю копейку] и как поставить капкан"],
 ["Качества 19–26","",
  "понимают, что [проблемы неизбежны] и их появление предсказуемо",
  "[просят то, что действительно хотят]; [практичны]",
  "очень [чувствительны к рынку]",
  "их [трудно запугать]",
  "они [одиноки] и привыкают к одиночеству",
  "чувствуют, когда надо [прибыть на парад вовремя и возглавить его]",
  "[готовы поделиться]",
  "[противоречивы, упрямы, капризны]"]],
 m:"26 качеств. Ключ: мечта и вера → упорство и цели → знают себя и не боятся начать заново → чувствуют рынок и потребителя → одиноки, упрямы, но готовы делиться.",
 x:"⚠ В файле опечатка «постоянно стремится» — по смыслу «стремятся»."},
{n:24,t:"Главные источники мотивации предпринимателя в США",u:"Источник",d:[
 ["4 источника","",
  "желание получить [большой контроль за своим собственным будущим]",
  "желание [распространить свой собственный стиль и образ жизни] на сферу деловой активности",
  "надежда в гораздо большей мере [объединить в одно целое работу и личную жизнь]",

 m:"Контроль, Свой стиль, Работа + жизнь, Деньги («КСЖД»)."},
{n:25,t:"Факторы, сдерживающие развитие предпринимательства в России",u:"Фактор",d:[
 ["9 факторов","",
  "[негативная экономическая политика и обстановка] (спад производства, хаос, инфляция, непосильные налоги, поборы, бюрократизм, коррупция, чиновничий произвол, ведомственные интересы)",
  "[отсутствующая или слабая финансовая база]",
  "[ограниченный доступ] к сырью, производственным площадям, кредитам, информации",
  "[неразвитость рыночной инфраструктуры], обслуживающей предпринимателей",

  "[отсутствие необходимых знаний], низкая квалификация",

  "[структурная деформация] предпринимательства",
  "[организованная преступность]: немалая часть бизнеса под контролем криминала; [коррупция, сращивание бизнесменов и госаппарата]"]],

{n:29,t:"Автономное учреждение",u:"Пункт",d:[
 ["Пункты 1–4","ФЗ «Об автономных учреждениях» от 03.11.2006 № 174-ФЗ, ст. 2",
  "1. [Некоммерческая организация], созданная [РФ, субъектом РФ или муниципальным образованием] для выполнения работ, оказания услуг в целях осуществления полномочий органов власти и местного самоуправления — в сферах [науки, образования, здравоохранения, культуры, соцзащиты, занятости, физкультуры и спорта] и иных",
  "2. Является [юридическим лицом]: от своего имени приобретает и осуществляет права, несёт обязанности, может быть [истцом и ответчиком] в суде",
  "3. Вправе [открывать счета в кредитных организациях]",
  "4. Отвечает по обязательствам [закреплённым за ним имуществом], [за исключением недвижимого и особо ценного движимого имущества], закреплённого учредителем или купленного на средства учредителя"],
 ["Пункты 5–9","",
  "5. [Собственник имущества не отвечает] по обязательствам автономного учреждения",
  "6. Автономное учреждение [не отвечает по обязательствам собственника] имущества",
  "7. Действует в соответствии с [предметом и целями], определёнными федеральными законами и [уставом], путём выполнения работ, оказания услуг в сферах из п. 1",
  "8. [Доходы поступают в его самостоятельное распоряжение] и используются для достижения целей, ради которых оно создано",
  "9. [Собственник не имеет права на получение доходов] от деятельности учреждения и использования закреплённого имущества"],
 ["Пункты 10–13","",
  "10. [Ежегодно публикует отчёты] о деятельности и использовании имущества в СМИ, определённых учредителем (порядок и перечень сведений — Правительство РФ)",
  "11. Обязано вести [бухгалтерский учёт], представлять бухгалтерскую и [статистическую] отчётность",
  "12. Предоставляет информацию о деятельности в [органы госстатистики, налоговые органы], иные органы и лицам по закону и уставу",
  "13. Обеспечивает [открытость и доступность документов]: устав (с изменениями), свидетельство о госрегистрации, решение учредителя о создании, план ФХД, годовая бухгалтерская отчётность, аудиторское заключение и др."]],
 m:"13 пунктов: 1–4 что это и как отвечает; 5–6 взаимная неответственность с собственником; 7–9 цели и доходы; 10–13 отчётность и открытость."},

{n:45,t:"Виды издержек",u:"Вид",d:[

 ["","","[Явные (бухгалтерские) издержки — explicit cost]","альтернативные издержки в форме [явных денежных платежей поставщикам факторов производства] и промежуточных изделий: зарплата, проценты, рента, оплата земли, капитала, информации, транспорта и пр.","называются бухгалтерскими, так как [отражаются в бухгалтерском балансе]; выступают в виде [себестоимости продукции]"],

{t:"Средние и предельные издержки",n:[47,48],r:[["Средние","издержки [на единицу] продукции (AFC, AVC, ATC)"],["Предельные (MC)","[прирост общих издержек] при выпуске [ещё одной единицы]"]]},
{t:"Элементы себестоимости и калькуляция",n:[50,51],r:[["Элементы себестоимости","затраты [по экономическому содержанию]: материальные, оплата труда, отчисления, амортизация, прочие"],["Калькуляция","расчёт себестоимости [по статьям расходов]"]]},
{t:"Виды прибыли",n:[53],r:[["Бухгалтерская","доход − [явные] издержки"],["Экономическая","доход − [явные и неявные] издержки; [сверхприбыль]"],["Нормальная","[минимум], чтобы остаться в отрасли"],["Абсолютная (общая)","доход − [валовые] издержки"],["Предельная","[MR − MC]"],["Средняя","при [средних условиях] и свободной конъюнктуре"]]},
{t:"Валовой и предельный доход",n:[55],r:[["Валовой","[P × Q]"],["Предельный","[прирост дохода] от ещё одной единицы; при совершенной конкуренции [= цене]"]]},
{t:"Положительный и отрицательный эффект масштаба",n:[57],r:[["Положительный","средние издержки [падают]: специализация, управление, масштабная техника, отходы в дело"],["Отрицательный","средние издержки [растут]: трудно управлять, конфликты, нагрузка на территорию, координация, негибкость"]]},
{t:"Прямые и портфельные инвестиции",n:[61],r:[["Прямые","доли/акции [с участием в управлении]"],["Портфельные","портфель бумаг, [пассивное владение], без управления"]]},
{t:"Финансовые, нефинансовые и реальные инвестиции",n:[61],r:[["Финансовые","[ценные бумаги] и [депозиты]"],["Нефинансовые","[неденежные]: права, лицензии, ноу-хау, машины, земля"],["Реальные","долгосрочно [в материальное производство]"]]},
{t:"Источники финансирования инвестиций",n:[66],r:[["Собственные","[прибыль], накопления"],["Заёмные","[кредиты банков], займы организаций"],["Привлечённые","от [продажи акций] и других бумаг"],["Бюджетные","из [бюджета и внебюджетных фондов]"]]},
{t:"Инвестиции в образование и в здоровье",n:[73],r:[["Образование","создаёт [новый качественный уровень] человеческого капитала"],["Здоровье","в основном [восстанавливает и поддерживает] способности, [продлевает срок] использования капитала"]]}
];

const $=s=>document.querySelector(s);
const view=$("#view");
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let known=new Set(load("econ4-known",[])),weak=new Set(load("econ4-weak",[])),mist=new Set(load("econ4-mist",[]));
let st={mode:load("econ4-mode","cards"),v:load("econ4-v",1)};
let queue=[],pos=0,shown=0,clozeIdx=0,q="",test=null;

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const bold=s=>esc(s).replace(/\[([^\]]+)\]/g,"<b>$1</b>");
const blanks=s=>esc(s).replace(/\[([^\]]+)\]/g,(m,w)=>`<span class="blank" tabindex="0" role="button" aria-label="Показать слово">${w}</span>`);
const byN=n=>D.find(c=>c.n==n);
const deck=()=>D.filter(c=>st.v==0||c.s==st.v);
const parts=b=>b.slice(2).filter(Boolean);
const total=c=>c.d.reduce((a,b)=>a+parts(b).length,0);
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return n+" "+(m==1&&h!=11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function head(c,i){
  const b=c.d[i];
  let h=b[0]||(c.d.length>1?`${c.u} ${i+1}`:"");
  return (h?`<span class="bh">${esc(h)}</span>`:"")+(b[1]?`<span class="src">${esc(b[1])}</span>`:"");
}
function metaLine(c){
  const T=total(c),n=c.d.length,defs=c.d.filter(b=>/^Определение \d/.test(b[0])).length;
  const pc=plural(T,"часть","части","частей");
  if(defs>1) return `<b>${plural(defs,"определение","определения","определений")}</b> · ${n>defs?plural(n,"блок","блока","блоков")+" · ":""}${pc}`;
  if(n>1) return `<b>${plural(n,"блок","блока","блоков")}</b> · ${pc}`;
  return pc;
}
const figHTML=c=>c.fig?`<div class="figbox">${FIG[c.fig]}<p class="figcap">${esc(c.cap||"")}</p></div>`:"";
const noteHTML=c=>`<div class="mn"><strong>Как запомнить:</strong> ${esc(c.m)}</div>${c.x?`<div class="wr"><strong>${c.x.startsWith("⚠")?"":"⚠ "}</strong>${esc(c.x)}</div>`:""}`;

function blocksHTML(c,upto,fresh){
  let k=0,out="";
  c.d.forEach((b,i)=>{
    const ps=parts(b),start=k;k+=ps.length;
    if(upto<=start){
      out+=`<div class="blk closed">${c.d.length>1?`${esc(b[0]&&/^(Определение|Вариант|Форма|Способ|Закон|Черта|Объяснение|Разновидность|Основное понятие|Ст\.)/.test(b[0])?b[0].replace(/ ·.*$/,""):c.u+" "+(i+1))} из ${c.d.length}`:"Ответ"} · ${plural(ps.length,"часть","части","частей")}</div>`;
      return;
    }
    out+=`<div class="blk">${head(c,i)}`;
    ps.forEach((p,j)=>{const idx=start+j;out+= idx<upto?`<p class="pt${idx==fresh?" new":""}">${bold(p)}</p>`:`<p class="pt ph">часть ${j+1}</p>`});
    out+=`</div>`;
  });
  return out;
}

function buildQueue(list){queue=list||deck().filter(c=>!known.has(c.n));pos=0;shown=0}
function setBtns(){document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode==st.mode))}
function progress(){
  const d=deck(),k=d.filter(c=>known.has(c.n)).length;
  return `<div class="progress"><div class="track"><div class="fill" style="width:${d.length?k/d.length*100:0}%"></div></div>
  <div class="ptext"><span>Запомнено ${k} из ${d.length}</span><button class="link" id="reset">Начать раздел заново</button></div></div>`;
}
function render(){
  setBtns();
  ({cards:renderCards,cloze:renderCloze,test:renderTest,pairs:renderPairs,mist:renderMist,list:renderList}[st.mode]||renderCards)();
  const r=$("#reset");if(r)r.onclick=()=>{deck().forEach(c=>known.delete(c.n));save("econ4-known",[...known]);buildQueue();render()};
}

function renderCards(fresh){
  if(!queue.length){
    view.innerHTML=progress()+`<div class="card noclick done" style="margin-top:14px"><p class="q">Все карточки раздела отмечены как выученные</p>
    <p class="tips">Проверь себя в «Тесте» или «Пропусках», либо нажми «Начать раздел заново».</p></div>`;
    const r=$("#reset");if(r)r.onclick=()=>{deck().forEach(c=>known.delete(c.n));save("econ4-known",[...known]);buildQueue();render()};
    return;
  }
  const c=queue[pos],T=total(c),all=shown>=T;
  view.innerHTML=progress()+`<div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
   <div class="tools"><select class="jump" id="jump" style="flex:1;min-width:0" aria-label="Перейти к пункту">${queue.map((x,i)=>`<option value="${i}"${i==pos?" selected":""}>№ ${x.n}. ${esc(x.t)}</option>`).join("")}</select>
   <button class="btn sm" id="shuf">Перемешать</button></div>
   <div class="card${all?" noclick":""}" id="card" tabindex="0" role="button" aria-label="Открыть следующую часть">
    <span class="tag">${SHORT[c.s]} · № ${c.n} · осталось ${queue.length}</span>
    <p class="q">${esc(c.t)}</p>
    <p class="meta">${metaLine(c)}${shown?` · открыто ${shown}/${T}`:""}</p>
    ${shown?figHTML(c):""}
    <div class="blocks">${blocksHTML(c,shown,fresh)}</div>
    ${all?noteHTML(c):`<p class="tapnote">${shown?"Вспомни следующую часть и нажми на карточку (или пробел).":"Сначала проговори ответ сам, потом открывай по частям — нажатием на карточку или пробелом."}</p>`}
   </div>
   ${all?`<div class="actions"><button class="btn again" id="again">Ещё раз</button><button class="btn know" id="know">Помню</button></div>`
     :`<div class="actions"><button class="btn ghost" id="allp">Показать всё</button><button class="btn primary" id="nextp">Следующая часть</button></div>
       <button class="link" id="skip" style="align-self:center">Пропустить карточку</button>`}
  </div>`;
  const step=()=>{if(shown<T){shown++;renderCards(shown-1)}};
  $("#card").onclick=step;
  $("#jump").onchange=e=>{pos=+e.target.value;shown=0;renderCards()};
  $("#shuf").onclick=()=>{shuffle(queue);pos=0;shown=0;renderCards()};
  if(all){
    $("#know").onclick=()=>{known.add(c.n);weak.delete(c.n);save("econ4-known",[...known]);save("econ4-weak",[...weak]);queue.splice(pos,1);if(pos>=queue.length)pos=0;shown=0;renderCards()};
    $("#again").onclick=()=>{weak.add(c.n);save("econ4-weak",[...weak]);queue.splice(pos,1);queue.splice(Math.min(pos+3,queue.length),0,c);shown=0;renderCards()};
  }else{
    $("#nextp").onclick=e=>{e.stopPropagation();step()};
    $("#allp").onclick=()=>{shown=T;renderCards()};
    $("#skip").onclick=()=>{queue.push(queue.splice(pos,1)[0]);shown=0;renderCards()};
  }
}

let clozeOrder=null;
function renderCloze(){
  const d=clozeOrder&&clozeOrder.every(c=>deck().includes(c))&&clozeOrder.length==deck().length?clozeOrder:deck();
  if(clozeIdx>=d.length)clozeIdx=0;const c=d[clozeIdx];
  view.innerHTML=`<p class="tips">Вспомни слово, потом нажми на пропуск.</p>
  <div class="tools" style="margin-top:8px"><select class="jump" id="jump" style="flex:1;min-width:0" aria-label="Перейти к пункту">${d.map((x,i)=>`<option value="${i}"${i==clozeIdx?" selected":""}>№ ${x.n}. ${esc(x.t)}</option>`).join("")}</select>
  <button class="btn sm" id="shuf">Перемешать</button></div>
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">
   <div class="card noclick"><span class="tag">${SHORT[c.s]} · № ${c.n} · ${clozeIdx+1} из ${d.length}</span>
    <p class="q">${esc(c.t)}</p><p class="meta">${metaLine(c)}</p>
    ${figHTML(c)}
    <div class="blocks">${c.d.map((b,i)=>`<div class="blk">${head(c,i)}${parts(b).map(p=>`<p class="pt">${blanks(p)}</p>`).join("")}</div>`).join("")}</div>
    <details class="mn"><summary><strong>Подсказка и примечания</strong> (откроются по нажатию)</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">${noteHTML(c)}</div></details>
   </div>
   <div class="actions"><button class="btn ghost" id="prev">Назад</button><button class="btn" id="all">Открыть всё</button></div>
   <button class="btn know" id="next">Дальше</button>
  </div>`;
  view.querySelectorAll(".blank").forEach(b=>{const o=()=>b.classList.add("open");b.onclick=o;b.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();o()}}});
  $("#all").onclick=()=>view.querySelectorAll(".blank").forEach(b=>b.classList.add("open"));
  $("#next").onclick=()=>{clozeIdx=(clozeIdx+1)%d.length;renderCloze()};
  $("#prev").onclick=()=>{clozeIdx=(clozeIdx-1+d.length)%d.length;renderCloze()};
  $("#jump").onchange=e=>{clozeIdx=+e.target.value;renderCloze()};
  $("#shuf").onclick=()=>{clozeOrder=shuffle(deck().slice());clozeIdx=0;renderCloze()};
}

function testPool(){const ns=new Set(deck().map(c=>c.n));return T.map((t,i)=>i).filter(i=>ns.has(T[i][0]))}
function newTest(){const pool=shuffle(testPool());test={qs:pool.slice(0,20).map(i=>({i,o:shuffle(T[i].slice(2).map((t,k)=>({t,ok:k==0})))})),at:0,ok:0,ans:null}}
function renderTest(){
  if(!test||test.v!==st.v){newTest();test.v=st.v}
  const n=test.qs.length;
  if(!n){view.innerHTML=`<div class="card noclick done"><p class="q">В этом разделе нет вопросов</p></div>`;return}
  if(test.at>=n){
    view.innerHTML=`<div class="card noclick done"><span class="tag">Тест завершён</span><p class="q">Результат: ${test.ok} из ${n}</p>
     <p class="tips">${test.ok==n?"Без ошибок!":"Ошибки сохранены во вкладке «Ошибки»."}</p>
     <div class="tools" style="justify-content:center"><button class="btn primary" id="again">Новый тест</button><button class="btn" id="gomist">К ошибкам</button></div></div>`;
    $("#again").onclick=()=>{newTest();test.v=st.v;renderTest()};
    $("#gomist").onclick=()=>{st.mode="mist";save("econ4-mode",st.mode);render()};
    return;
  }
  const Q=test.qs[test.at],t=T[Q.i],c=byN(t[0]);
  view.innerHTML=`<div class="progress"><div class="track"><div class="fill" style="width:${test.at/n*100}%"></div></div>
   <div class="ptext"><span>Вопрос ${test.at+1} из ${n} · верно ${test.ok}</span><button class="link" id="restart">Новый тест</button></div></div>
   <div class="card noclick" style="margin-top:14px"><span class="tag">${SHORT[c.s]} · к пункту № ${t[0]}</span>
    <p class="q">${esc(t[1])}</p>
    <div class="opts">${Q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
  $("#restart").onclick=()=>{newTest();test.v=st.v;renderTest()};
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,good=Q.o[k].ok;
    view.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(Q.o[j].ok)x.classList.add("good")});
    if(good){test.ok++;mist.delete(Q.i)}else{b.classList.add("bad");mist.add(Q.i)}
    save("econ4-mist",[...mist]);
    $("#fb").innerHTML=`<p class="verdict ${good?"good":"bad"}">${good?"Верно!":"Неверно."}</p>
     <p class="tips">Тема: № ${c.n}. ${esc(c.t)}</p>
     <div class="actions" style="margin-top:8px"><button class="btn ghost" id="open">Открыть карточку</button><button class="btn primary" id="nx">Дальше</button></div>`;
    $("#nx").onclick=()=>{test.at++;renderTest()};
    $("#open").onclick=()=>{st.mode="list";q="№"+c.n;save("econ4-mode",st.mode);render()};
  });
}

function renderPairs(){
  const ns=new Set(deck().map(c=>c.n));
  const list=P.filter(p=>p.n.some(n=>ns.has(n)));
  view.innerHTML=`<p class="tips">Похожие понятия, которые легко спутать. Вспомни отличие, потом нажми на синее поле.</p>
   <div class="tools" style="margin-top:8px"><button class="btn sm" id="openall">Открыть всё</button><button class="btn sm" id="hideall">Скрыть всё</button></div>
   <div class="list" style="margin-top:10px">${list.length?list.map(p=>`<article class="item"><h3>${esc(p.t)}</h3>
    ${p.r.map(r=>`<div class="row"><div class="nm">${esc(r[0])}</div><div class="tx" tabindex="0" role="button">${bold(r[1])}</div></div>`).join("")}
    <span class="refs">Пункты: ${p.n.map(n=>"№ "+n).join(", ")}</span></article>`).join(""):`<p class="empty">Для этого раздела сравнений нет — выбери «Все разделы».</p>`}</div>`;
  view.querySelectorAll(".tx").forEach(t=>{const o=()=>t.classList.add("open");t.onclick=o;t.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();o()}}});
  $("#openall").onclick=()=>view.querySelectorAll(".tx").forEach(t=>t.classList.add("open"));
  $("#hideall").onclick=()=>view.querySelectorAll(".tx").forEach(t=>t.classList.remove("open"));
}

function renderMist(){
  const w=D.filter(c=>weak.has(c.n)),m=[...mist].filter(i=>T[i]);
  view.innerHTML=`<div class="item"><h3>Карточки «Ещё раз» (${w.length})</h3>
    ${w.length?`<p class="tips">${w.map(c=>"№ "+c.n+". "+esc(c.t)).join("<br>")}</p><div class="tools"><button class="btn primary sm" id="rep">Повторить эти карточки</button><button class="btn sm" id="cw">Очистить</button></div>`:`<p class="tips">Пусто. Сюда попадают карточки, на которых ты нажал «Ещё раз».</p>`}</div>
   <div class="item" style="margin-top:10px"><h3>Ошибки в тесте (${m.length})</h3>
    ${m.length?m.map(i=>`<div class="blk"><span class="bh">к пункту № ${T[i][0]}</span><p class="pt">${esc(T[i][1])}</p><p class="pt"><b>${esc(T[i][2])}</b></p></div>`).join("")+`<div class="tools"><button class="btn primary sm" id="retest">Пройти ошибки ещё раз</button><button class="btn sm" id="cm">Очистить</button></div>`:`<p class="tips">Пусто. Сюда попадают вопросы теста, на которые ответ был неверным.</p>`}</div>`;
  if(w.length){$("#rep").onclick=()=>{st.mode="cards";buildQueue(w.slice());setBtns();renderCards()};$("#cw").onclick=()=>{weak.clear();save("econ4-weak",[]);renderMist()}}
  if(m.length){$("#retest").onclick=()=>{test={qs:shuffle(m.slice()).map(i=>({i,o:shuffle(T[i].slice(2).map((t,k)=>({t,ok:k==0})))})),at:0,ok:0,v:st.v};st.mode="test";setBtns();renderTest()};$("#cm").onclick=()=>{mist.clear();save("econ4-mist",[]);renderMist()}}
}

function renderList(){
  view.innerHTML=`<input class="search" id="search" type="search" placeholder="Поиск: амортизация, ПИФ, № 42…" value="${esc(q)}">
  <div class="list" id="lst" style="margin-top:12px"></div>`;
  const draw=()=>{
    const t=q.trim().toLowerCase(),num=t.match(/^№\s*(\d+)$/);
    const items=(num?D:deck()).filter(c=>num?c.n==+num[1]:!t||(c.t+" "+c.d.flat().join(" ")+" "+c.n).toLowerCase().includes(t));
    $("#lst").innerHTML=items.length?items.map(c=>`<article class="item"><span class="tag">${SHORT[c.s]} · № ${c.n} · ${metaLine(c).replace(/<[^>]+>/g,"")}</span>
      <h3>${esc(c.t)}</h3>${figHTML(c)}${c.d.map((b,i)=>`<div class="blk">${head(c,i)}${parts(b).map(p=>`<p class="pt">${bold(p)}</p>`).join("")}</div>`).join("")}
      ${noteHTML(c)}</article>`).join(""):`<p class="empty">Ничего не найдено. Попробуй другое слово.</p>`;
  };
  $("#search").oninput=e=>{q=e.target.value;draw()};draw();
}

const sec=$("#sec");
sec.innerHTML=Object.entries(SEC).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")+`<option value="0">Все разделы (№ 1–73)</option>`;
sec.value=st.v;
sec.onchange=e=>{st.v=+e.target.value;save("econ4-v",st.v);clozeIdx=0;clozeOrder=null;test=null;buildQueue();render()};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;save("econ4-mode",st.mode);if(st.mode=="cards")buildQueue();shown=0;render()});
document.addEventListener("keydown",e=>{
  if(st.mode!="cards"||!queue.length||/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;
  if(e.key==" "||e.key=="Enter"){e.preventDefault();const c=queue[pos];if(shown<total(c)){shown++;renderCards(shown-1)}}
});
buildQueue();render();
</script>
</body>
</html>
